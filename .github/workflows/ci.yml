name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  tests:
    # Only in the public repo: a copy of this file in a private source repo uses no Actions minutes.
    if: github.repository == 's-boris/claude-privacy-vault'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils sqlite3 python3-pil  # PIL: photo OCR prep (the image has python3-pil too)
      - name: Vault venv (hash-pinned, the same steps as the Dockerfile)
        run: |
          sudo python3 -m venv /opt/vault/venv
          sudo /opt/vault/venv/bin/pip install -q --disable-pip-version-check --require-hashes --no-deps -r requirements/build.txt
          sudo /opt/vault/venv/bin/pip install -q --disable-pip-version-check --require-hashes --no-deps \
            --no-build-isolation --use-pep517 -r requirements/tgread.txt
      - name: Offline test suites (mocked LLM, fake servers)
        env:
          TZ: Europe/Zurich
          TGREAD_PY: /opt/vault/venv/bin/python3
        run: bash tools/run-tests.sh

  privacy:
    # Only in the public repo: a copy of this file in a private source repo uses no Actions minutes.
    if: github.repository == 's-boris/claude-privacy-vault'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: gitleaks 8.30.1 (pinned binary, checksum-verified)
        run: |
          curl -fsSLo gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks && ./gitleaks git . --config .gitleaks.toml --redact --no-banner
      - name: pdftotext for the PDF check
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils
      - name: Private denylist + PII + prose + syntax gate
        env:
          PUBLIC_DENYLIST: ${{ secrets.PUBLIC_DENYLIST }}
        run: |
          [ -n "$PUBLIC_DENYLIST" ] || echo "::warning::PUBLIC_DENYLIST is not set (forks get no secrets): PII and prose checks only"
          python3 -I tools/public-gate.py --ignore s-boris
